development:
  host: localhost
  adapter: postgresql
  database: scout_tree_recycle_development
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  encoding: unicode
  timeout: 5000

test:
  host: localhost
  adapter: postgresql
  database: scout_tree_recycle_test
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  encoding: unicode
  timeout: 5000

default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= Rails.application.credentials.dig(:database, :host) %>
  username: <%= Rails.application.credentials.dig(:database, :username) %>
  password: <%= Rails.application.credentials.dig(:database, :password) %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

production:
  primary: &primary_production
    <<: *default
    database: scout_tree_recycle_production
    password: <%= Rails.application.credentials.dig(:database, :password) %>
    idle_timeout: 60
  queue: &sqlite
    adapter: sqlite3
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    timeout: 5000
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
    pragmas:
      foreign_keys: true
      journal_mode: wal
      synchronous: normal
  cable:
    <<: *sqlite
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
