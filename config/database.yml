development:
  host: localhost
  adapter: postgresql
  database: scout-tree-recycle-development
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  encoding: unicode
  timeout: 5000

test:
  host: localhost
  adapter: postgresql
  database: scout-tree-recycle-test
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  encoding: unicode
  timeout: 5000

default: &default
  adapter: postgresql
  encoding: unicode
  host: ep-lingering-grass-bfyzkrkf.c-5.us-west-2.aws.neon.tech
  username: neondb_owner
  password: <%= Rails.application.credentials.dig(:neon_database, :password) %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

production:
  primary: &primary_production
    <<: *default
    database: scout_tree_recycle_production
    password: <%= Rails.application.credentials.dig(:neon_database, :password) %>
  # not used - we are going with :memory_store
  cache:
    <<: *primary_production
    database: scout_tree_recycle_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: scout_tree_recycle_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: scout_tree_recycle_production_cable
    migrations_paths: db/cable_migrate
