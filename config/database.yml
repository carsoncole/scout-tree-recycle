default: &default
  adapter: postgresql
  encoding: unicode
  host: 192.168.0.195
  username: tree_recycle
  password: <%= Rails.application.credentials.dig(:production_db_password) %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  <<: *default
  database: tree_recycle_development

test:
  <<: *default
  database: tree_recycle_test

production:
  primary: &primary_production
    <<: *default
    database: tree_recycle_production
    password: <%= Rails.application.credentials.dig(:production_db_password) %>
  cache:
    <<: *primary_production
    database: tree_recycle_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: tree_recycle_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: tree_recycle_production_cable
    migrations_paths: db/cable_migrate
