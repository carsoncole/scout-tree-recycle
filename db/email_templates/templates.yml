# Built-in marketing email templates. The migration seeds these, and admins can
# reload them with "Load Default Templates" or the marketing_email_templates
# rake task. HTML and text bodies live in the sibling files.
# Unsubscribe is not part of these templates. Marketing emails append it.
marketing_email_1:
  description: "Announces that tree pickup reservations are open."
  from: ""
  subject: "Reservations are open for tree pickup on {{ event.pickup_start_short }}"
  html_file: marketing_email_1.html
  text_file: marketing_email_1.text

marketing_email_2:
  description: "Reminds contacts who received the first email, and have not reserved, that the signup deadline is approaching."
  from: ""
  subject: "Reminder: reserve your tree pickup by {{ event.sign_up_deadline_short }}"
  html_file: marketing_email_2.html
  text_file: marketing_email_2.text
