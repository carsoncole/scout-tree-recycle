marketing_email_1:
  name: marketing_email_1
  description: First marketing email announcing that registration is open.
  subject: "Tree recycling {{ event.pickup_start_short }}. Register today."
  body_html: |
    <style>
      .email-heading { color: #123456; font-size: 32px; }
      .email-text { color: #4a5568; }
    </style>
    <h1 class="email-heading">Support {{ setting.organization_name }}! - Tree Recycling</h1>
    {% if contact.has_name %}<p class="email-text">Hi {{ contact.name }}!</p>{% endif %}
    <p class="email-text">Registration is now open for {{ event.pickup_start_weekday }}.</p>
    <a href="{{ urls.registration }}">Reserve My Tree Pickup</a>
    <p>{{ setting.organization_name }}</p>
    {% if urls.organization != blank %}<a href="{{ urls.organization }}">{{ setting.organization_name }}</a>{% endif %}
  body_text: |
    Support {{ setting.organization_name }}! - Tree Recycling
    {% if contact.has_name %}Hi {{ contact.name }}!{% endif %}
    Reserve My Tree Pickup: {{ urls.registration }}
  published_subject: "Tree recycling {{ event.pickup_start_short }}. Register today."
  published_body_html: |
    <style>
      .email-heading { color: #123456; font-size: 32px; }
      .email-text { color: #4a5568; }
    </style>
    <h1 class="email-heading">Support {{ setting.organization_name }}! - Tree Recycling</h1>
    {% if contact.has_name %}<p class="email-text">Hi {{ contact.name }}!</p>{% endif %}
    <p class="email-text">Registration is now open for {{ event.pickup_start_weekday }}.</p>
    <a href="{{ urls.registration }}">Reserve My Tree Pickup</a>
    <p>{{ setting.organization_name }}</p>
    {% if urls.organization != blank %}<a href="{{ urls.organization }}">{{ setting.organization_name }}</a>{% endif %}
  published_body_text: |
    Support {{ setting.organization_name }}! - Tree Recycling
    {% if contact.has_name %}Hi {{ contact.name }}!{% endif %}
    Reserve My Tree Pickup: {{ urls.registration }}
  published_at: "2026-01-01 00:00:00"

marketing_email_2:
  name: marketing_email_2
  description: Reminder email for contacts who have not registered yet.
  subject: "Last call! Tree recycling {{ event.pickup_start_short }}. Register today."
  body_html: |
    <style>
      .reminder-heading { color: #123456; font-size: 32px; }
    </style>
    <h1 class="reminder-heading">Reserve your Pickup Today</h1>
    {% if contact.has_name %}<p>Hello {{ contact.name }},</p>{% endif %}
    <p>{{ setting.organization_name }} is picking up trees on {{ event.pickup_start_weekday }}.</p>
    <a href="{{ urls.registration }}">Register for a tree pickup</a>
    <p>Register by {{ event.pickup_end_weekday }}.</p>
    {% if urls.organization != blank %}<a href="{{ urls.organization }}">{{ setting.organization_name }}</a>{% endif %}
  body_text: |
    Reserve your Pickup Today
    {% if contact.has_name %}Hello {{ contact.name }},{% endif %}
    {{ setting.organization_name }} is picking up trees on {{ event.pickup_start_weekday }}.
    Register at {{ urls.registration }}
  published_subject: "Last call! Tree recycling {{ event.pickup_start_short }}. Register today."
  published_body_html: |
    <style>
      .reminder-heading { color: #123456; font-size: 32px; }
    </style>
    <h1 class="reminder-heading">Reserve your Pickup Today</h1>
    {% if contact.has_name %}<p>Hello {{ contact.name }},</p>{% endif %}
    <p>{{ setting.organization_name }} is picking up trees on {{ event.pickup_start_weekday }}.</p>
    <a href="{{ urls.registration }}">Register for a tree pickup</a>
    <p>Register by {{ event.pickup_end_weekday }}.</p>
    {% if urls.organization != blank %}<a href="{{ urls.organization }}">{{ setting.organization_name }}</a>{% endif %}
  published_body_text: |
    Reserve your Pickup Today
    {% if contact.has_name %}Hello {{ contact.name }},{% endif %}
    {{ setting.organization_name }} is picking up trees on {{ event.pickup_start_weekday }}.
    Register at {{ urls.registration }}
  published_at: "2026-01-01 00:00:00"

