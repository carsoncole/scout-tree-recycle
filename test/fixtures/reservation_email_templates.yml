    <p>{{ reservation.street | escape }}</p>
    {% if reservation.pickup_notes != blank %}<p>{{ reservation.pickup_notes | escape }}</p>{% endif %}
    <p>{{ setting.pickup_instructions | escape }}</p>
    {% unless reservation.donation_received %}
      <h2>Support our fundraiser</h2>
      <p>Tree recycling is a fundraiser for {{ setting.organization_name }}. We suggest a donation of {{ setting.suggested_donation_currency }}.</p>
      <p>If you elect to donate on the day of collection, we accept checks or cash.</p>
      <ul>
        <li>make checks payable to {{ setting.organization_name }}</li>
        <li>place your donation in an envelope</li>
        <li>place that envelope in a baggie</li>
        <li>secure the baggie to your tree</li>
      </ul>
      <p><a href="{{ urls.donation }}">make an online donation</a></p>
    {% endunless %}
