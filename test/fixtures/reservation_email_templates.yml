new_reservation_email:
  name: new_reservation_email
  description: Confirmation sent when a reservation is scheduled for tree pickup.
  subject: "Your tree pickup is confirmed"
  logo_image: fleur-de-lis-2024-logo-4c-bc.png
  logo_width: 140
  logo_alt: Tree Recycling Event
  body_html: |
    <style>
      .test-heading { color: #123456; font-size: 32px; }
    </style>
    <h1 class="test-heading">Tree pick-up scheduled</h1>
    {% if reservation.has_name %}<p>Dear {{ reservation.name | escape }},</p>{% endif %}
    <p>This email is to confirm that we will be picking up your tree on {{ event.pickup_start_month_day_year }}.</p>
    <p>{{ reservation.street | escape }}</p>
    <p>We will collect your tree between {{ event.pickup_start_time_compact }} and {{ event.pickup_end_time_compact }}.</p>
    <p>We suggest a donation of {{ setting.suggested_donation_currency }} for {{ setting.organization_name }}.</p>
    <p><a href="{{ urls.donation }}">donate online</a></p>
    <p><a href="{{ urls.edit_reservation }}">make a change</a></p>
  body_text: |
    Tree pick-up scheduled
    {% if reservation.has_name %}Dear {{ reservation.name | escape }},{% endif %}
    We will collect your tree between {{ event.pickup_start_time_compact }} and {{ event.pickup_end_time_compact }}.
    Donate online: {{ urls.donation }}
    Make a change: {{ urls.edit_reservation }}
  published_subject: "Your tree pickup is confirmed"
  published_logo_image: fleur-de-lis-2024-logo-4c-bc.png
  published_logo_width: 140
  published_logo_alt: Tree Recycling Event
  published_body_html: |
    <style>
      .test-heading { color: #123456; font-size: 32px; }
    </style>
    <h1 class="test-heading">Tree pick-up scheduled</h1>
    {% if reservation.has_name %}<p>Dear {{ reservation.name | escape }},</p>{% endif %}
    <p>This email is to confirm that we will be picking up your tree on {{ event.pickup_start_month_day_year }}.</p>
    <p>{{ reservation.street | escape }}</p>
    <p>We will collect your tree between {{ event.pickup_start_time_compact }} and {{ event.pickup_end_time_compact }}.</p>
    <p>We suggest a donation of {{ setting.suggested_donation_currency }} for {{ setting.organization_name }}.</p>
    <p><a href="{{ urls.donation }}">donate online</a></p>
    <p><a href="{{ urls.edit_reservation }}">make a change</a></p>
  published_body_text: |
    Tree pick-up scheduled
    {% if reservation.has_name %}Dear {{ reservation.name | escape }},{% endif %}
    We will collect your tree between {{ event.pickup_start_time_compact }} and {{ event.pickup_end_time_compact }}.
    Donate online: {{ urls.donation }}
    Make a change: {{ urls.edit_reservation }}
  published_at: "2026-01-01 00:00:00"

